<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudNotes Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f6fc;
        }

        .navbar {
            background: #173b70;
        }

        .container {
            max-width: 850px;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .note-card {
            border-left: 4px solid #2459a9;
            transition: transform 0.2s ease;
        }

        .note-card:hover {
            transform: translateY(-2px);
        }

        .note-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .note-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .note-actions button {
            flex: 1;
        }

        #message:empty {
            display: none;
        }

        @media (max-width: 576px) {
            .navbar .container {
                flex-direction: column;
                gap: 8px;
            }

            .container.py-5 {
                padding-top: 2rem !important;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark p-3">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand fw-bold">☁ CloudNotes</span>
        <span class="text-white">My Notes Dashboard</span>
    </div>
</nav>

<div class="container py-5">

    <h2>Welcome to CloudNotes</h2>
    <p class="text-secondary">Store and manage your notes.</p>

    <!-- ADD NOTE FORM -->
    <div class="card shadow-sm p-4 mb-4">
        <h4 class="mb-3">Add New Note</h4>

        <form id="noteForm">
            <input
                type="text"
                id="title"
                class="form-control my-3"
                placeholder="Note title"
                maxlength="200"
                required>

            <textarea
                id="content"
                class="form-control mb-3"
                placeholder="Write your note..."
                rows="4"
                required></textarea>

            <button class="btn btn-primary" type="submit">
                Add Note
            </button>
        </form>

        <p id="message" class="mt-3" role="status"></p>
    </div>

    <!-- NOTES LIST -->
    <h4 class="mb-3">My Notes</h4>
    <div id="notesList" class="row g-3"></div>

</div>

<script>
    const api = "/api/notes";

    const notesList = document.getElementById("notesList");
    const noteForm = document.getElementById("noteForm");
    const message = document.getElementById("message");

    // SHOW MESSAGE
    function showMessage(text, type) {
        message.textContent = text;
        message.className = "mt-3 text-" + type;
    }

    // LOAD AND DISPLAY NOTES
    async function loadNotes() {
        try {
            const response = await fetch(api);

            if (!response.ok) {
                throw new Error("Failed to load notes");
            }

            const notes = await response.json();

            notesList.replaceChildren();

            if (notes.length === 0) {
                const empty = document.createElement("p");
                empty.className = "text-secondary";
                empty.textContent = "No notes available. Add your first note!";
                notesList.appendChild(empty);
                return;
            }


            notes.forEach(note => {
                const col = document.createElement("div");
                col.className = "col-12";

                const card = document.createElement("div");
                card.className = "card note-card shadow-sm p-3 h-100";

                const title = document.createElement("h5");
                title.textContent = note.title;

                const content = document.createElement("p");
                content.className = "note-content mb-2";
                content.textContent = note.content;

                // EDIT BUTTON - declare only once
                const edit = document.createElement("button");
                edit.type = "button";
                edit.className = "btn btn-outline-primary btn-sm";
                edit.textContent = "Edit";

                edit.addEventListener("click", async () => {
                    const newTitle = prompt("Enter updated title:", note.title);

                    if (newTitle === null || !newTitle.trim()) return;

                    const newContent = prompt(
                        "Enter updated content:",
                        note.content
                    );

                    if (newContent === null || !newContent.trim()) return;

                    try {
                        const response = await fetch(`${api}/${note.id}`, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                title: newTitle.trim(),
                                content: newContent.trim()
                            })
                        });

                        if (!response.ok) {
                            throw new Error("Update failed: " + response.status);
                        }

                        showMessage("Note updated successfully!", "success");
                        await loadNotes();

                    } catch (error) {
                        console.error("Update error:", error);
                        showMessage("Unable to update note.", "danger");
                    }
                });

                // DELETE BUTTON
                const del = document.createElement("button");
                del.type = "button";
                del.className = "btn btn-outline-danger btn-sm";
                del.textContent = "Delete";

                del.addEventListener("click", async () => {
                    if (!confirm("Do you want to delete this note?")) return;

                    try {
                        const response = await fetch(`${api}/${note.id}`, {
                            method: "DELETE"
                        });

                        if (!response.ok) {
                            throw new Error("Delete failed: " + response.status);
                        }

                        showMessage("Note deleted successfully!", "success");
                        await loadNotes();

                    } catch (error) {
                        console.error("Delete error:", error);
                        showMessage("Unable to delete note.", "danger");
                    }
                });

                // DISPLAY BOTH BUTTONS
                const actions = document.createElement("div");
                actions.className = "note-actions";

                actions.appendChild(edit);
                actions.appendChild(del);

                card.appendChild(title);
                card.appendChild(content);
                card.appendChild(actions);

                col.appendChild(card);
                notesList.appendChild(col);
            });


        } catch (error) {
            console.error("Loading notes error:", error);
            notesList.textContent =
                "Unable to load notes. Please check the server.";
        }
    }

    // ADD NEW NOTE
    noteForm.addEventListener("submit", async event => {
        event.preventDefault();

        const note = {
            title: document.getElementById("title").value.trim(),
            content: document.getElementById("content").value.trim()
        };

        if (!note.title || !note.content) {
            showMessage("Please enter both title and content.", "danger");
            return;
        }

        try {
            const response = await fetch(api, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(note)
            });

            if (!response.ok) {
                throw new Error("Add failed: " + response.status);
            }

            noteForm.reset();
            showMessage("Note added successfully!", "success");
            await loadNotes();

        } catch (error) {
            console.error("Add note error:", error);
            showMessage("Failed to add note.", "danger");
        }
    });

    // INITIAL LOAD
    loadNotes();
</script>

</body>
</html>
